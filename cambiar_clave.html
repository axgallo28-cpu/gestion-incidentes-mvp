{% extends "base.html" %}
{% block title %}Cambiar contraseña | Centro de Ciberseguridad{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <section class="soc-panel"><div class="soc-panel-header"><h1 class="h4 mb-1">🔐 Cambiar contraseña</h1><p class="mb-0 small">Si recibiste una clave temporal, debes cambiarla antes de continuar.</p></div>
  <div class="p-4">
    <form method="POST" action="{{ url_for('cambiar_clave') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="actual" class="form-label">Contraseña actual o temporal</label>
      <input type="password" id="actual" name="clave_actual" class="form-control mb-3" autocomplete="current-password" required>
      <label for="nueva" class="form-label">Nueva contraseña (mínimo 12 caracteres)</label>
      <input type="password" id="nueva" name="nueva_clave" class="form-control mb-3" autocomplete="new-password" minlength="12" required>
      <label for="confirmar" class="form-label">Confirmar nueva contraseña</label>
      <input type="password" id="confirmar" name="confirmar_clave" class="form-control mb-3" autocomplete="new-password" minlength="12" required>
      <button class="btn btn-cyber w-100" type="submit">Guardar nueva contraseña</button>
    </form>
  </div></section>
</div></div>
{% endblock %}
